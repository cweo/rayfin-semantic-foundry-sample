name: Public npm compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_USERCONFIG: /dev/null
      RAYFIN_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install from public npm without registry credentials
        run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test
